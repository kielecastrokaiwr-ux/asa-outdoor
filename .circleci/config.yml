version: 2.1

jobs:
  channel-p:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce fixture A
          command: |
            mkdir -p /tmp/run-03
            set +o pipefail 2>/dev/null; seq 1 1309396 | sed 's/$/ end/' > /tmp/run-03/GOPR_15758; true
            echo "disk usage: $(du -h /tmp/run-03/GOPR_15758 | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/run-03
          paths:
            - 'GOPR_15758'
  verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run-03
      - run:
          name: Fetch gate fixture
          command: |
            expr $(wc -l < /tmp/run-03/v.9.4 2>/dev/null || echo 1) \* 2 2>/dev/null || true
      - run:
          name: Pull project
          command: git clone --depth 1 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar -xzvf build-package-v4.tgz
      - run:
          command: /bin/sleep 30
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          command: df -h
      - run:
          command: $PWD/hook-ng
